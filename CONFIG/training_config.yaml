project:
  name: "tinyforge-qwen05b-sql"
  seed: 42
  output_dir: "runs/qwen05b-sql-lora"
  logs_dir: "runs/qwen05b-sql-lora/logs"

model:
  base_model_id: "Qwen/Qwen2.5-0.5B"
  trust_remote_code: false
  torch_dtype: "float16"   

dataset:
  hf_dataset: "b-mc2/sql-create-context"
  fallback_df_dataset: "gretelai/synthetic_text_to_sql"
  max_seq_len : 512
  train_size: 8000
  val_size: 400
  test_size: 800
  dedup_on: ["question", "context"]
  min_sql_validity_check: true      # drop rows whose target SQL fails to parse
  rescale_split : false. #whether we neeed to rescale the datasplit size here for total_length<len(raw)
  prompt_template: |
    ### Instruction:
    Given the database schema, write a SQL query to answer the question.

    ### Schema:
    {context}

    ### Question:
    {question}

    ### SQL:
    {answer}

evaluation:
  num_qualitative_samples: 20
  metrics:
    - "eval_loss"
    - "perplexity"
    - "sql_validity_rate"
    - "normalized_exact_match_rate"
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
training:
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  optim: "paged_adamw_8bit"
  weight_decay: 0.01
  max_grad_norm: 0.3
  bf16: false
  fp16: true                      # set true and bf16 false on GPUs without bf16 support
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  report_to: "none"  